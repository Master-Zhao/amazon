name: amazon-ads-prod

x-prod-environment: &prod-environment
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
  DB_NAME: ${DB_NAME:-amazon_ads}
  DB_USER: ${DB_USER:-amazon_ads}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_HOST: mysql
  DB_PORT: "3306"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  SESSION_COOKIE_SECURE: "true"
  CSRF_COOKIE_SECURE: "true"
  SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
  CSRF_COOKIE_SAMESITE: ${CSRF_COOKIE_SAMESITE:-Lax}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
  JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
  JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS:-7}
  JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-refresh_token}
  JWT_REFRESH_COOKIE_PATH: ${JWT_REFRESH_COOKIE_PATH:-/api/v1/auth/}
  JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
  JWT_COOKIE_HTTP_ONLY: ${JWT_COOKIE_HTTP_ONLY:-true}
  JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE:-Lax}
  JWT_ROTATE_REFRESH_TOKENS: ${JWT_ROTATE_REFRESH_TOKENS:-true}
  JWT_BLACKLIST_AFTER_ROTATION: ${JWT_BLACKLIST_AFTER_ROTATION:-true}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  GIT_COMMIT: ${GIT_COMMIT:-unknown}
  BUILD_TIME: ${BUILD_TIME:-unknown}

x-prod-build: &prod-build
  context: ./backend
  target: production

x-prod-dependencies: &prod-dependencies
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: ${DB_NAME:-amazon_ads}
      MYSQL_USER: ${DB_USER:-amazon_ads}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.5-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["tools"]
    build: *prod-build
    image: amazon-ads-backend:0.1.0
    environment: *prod-environment
    depends_on: *prod-dependencies
    command: ["python", "manage.py", "migrate", "--noinput"]

  backend:
    build: *prod-build
    image: amazon-ads-backend:0.1.0
    environment: *prod-environment
    depends_on: *prod-dependencies
    volumes:
      - upload_prod_data:/app/media
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "60", "--access-logfile", "-", "--error-logfile", "-"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20

  celery-worker:
    build: *prod-build
    image: amazon-ads-backend:0.1.0
    environment: *prod-environment
    depends_on: *prod-dependencies
    volumes:
      - upload_prod_data:/app/media
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--queues=default,imports,analysis,maintenance", "--concurrency=4"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && celery -A config inspect ping --timeout 5 --destination celery@$${HOSTNAME} >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery-beat:
    build: *prod-build
    image: amazon-ads-backend:0.1.0
    environment: *prod-environment
    depends_on: *prod-dependencies
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && tr '\\0' ' ' </proc/1/cmdline | grep -Eq 'celery.*beat'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_APP_VERSION: ${APP_VERSION:-0.1.0}
        VITE_GIT_COMMIT: ${GIT_COMMIT:-unknown}
        VITE_BUILD_TIME: ${BUILD_TIME:-unknown}
    image: amazon-ads-frontend:0.1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/frontend-health"]
      interval: 10s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.28.0-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  mysql_prod_data:
  redis_prod_data:
  upload_prod_data:
