[project]
name = "amazon-ads-optimizer-backend"
version = "0.1.0"
description = "Phase 1 backend foundation for the Amazon Ads optimization system."
requires-python = ">=3.13,<3.14"
dependencies = [
  "celery[redis]>=5.6,<5.7",
  "django>=5.2,<5.3",
  "django-cors-headers>=4.7,<5",
  "djangorestframework>=3.16,<3.17",
  "djangorestframework-simplejwt>=5.5.1,<5.6",
  "drf-spectacular>=0.28,<0.29",
  "gunicorn>=23,<24",
  "openpyxl>=3.1,<3.2",
  "pymysql>=1.1,<2",
  "redis>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-django>=4.11,<5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
norecursedirs = [".venv", ".pytest_cache", "pytest-cache-files-*"]
addopts = "--strict-markers --disable-warnings -p no:cacheprovider"

[tool.coverage.run]
branch = true
source = ["api", "apps", "config"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "apps", "config"]
