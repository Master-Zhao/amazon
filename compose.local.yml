name: amazon-ads-local

x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: config.settings.local
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-key-not-for-production}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}
  DB_NAME: ${DB_NAME:-amazon_ads}
  DB_USER: ${DB_USER:-amazon_ads}
  DB_PASSWORD: ${DB_PASSWORD:-local-database-password}
  DB_HOST: mysql
  DB_PORT: "3306"
  REMOTE_AD_DATABASES_ENABLED: ${REMOTE_AD_DATABASES_ENABLED:-false}
  REMOTE_SCM_AUTH_ENABLED: ${REMOTE_SCM_AUTH_ENABLED:-false}
  SCM_REMOTE_DB_NAME: ${SCM_REMOTE_DB_NAME:-}
  SCM_REMOTE_DB_USER: ${SCM_REMOTE_DB_USER:-}
  SCM_REMOTE_DB_PASSWORD: ${SCM_REMOTE_DB_PASSWORD:-}
  SCM_REMOTE_DB_HOST: ${SCM_REMOTE_DB_HOST:-}
  SCM_REMOTE_DB_PORT: ${SCM_REMOTE_DB_PORT:-3306}
  ADS_ANALYSIS_REMOTE_DB_NAME: ${ADS_ANALYSIS_REMOTE_DB_NAME:-}
  ADS_ANALYSIS_REMOTE_DB_USER: ${ADS_ANALYSIS_REMOTE_DB_USER:-}
  ADS_ANALYSIS_REMOTE_DB_PASSWORD: ${ADS_ANALYSIS_REMOTE_DB_PASSWORD:-}
  ADS_ANALYSIS_REMOTE_DB_HOST: ${ADS_ANALYSIS_REMOTE_DB_HOST:-}
  ADS_ANALYSIS_REMOTE_DB_PORT: ${ADS_ANALYSIS_REMOTE_DB_PORT:-3306}
  REMOTE_AD_PROFILE_MERCHANT_MAP: ${REMOTE_AD_PROFILE_MERCHANT_MAP:-{}}
  REMOTE_AD_MAX_ROWS: ${REMOTE_AD_MAX_ROWS:-200}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://localhost:8080}
  JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
  JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS:-7}
  JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-refresh_token}
  JWT_REFRESH_COOKIE_PATH: ${JWT_REFRESH_COOKIE_PATH:-/api/v1/auth/}
  JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
  JWT_COOKIE_HTTP_ONLY: ${JWT_COOKIE_HTTP_ONLY:-true}
  JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE:-Lax}
  JWT_ROTATE_REFRESH_TOKENS: ${JWT_ROTATE_REFRESH_TOKENS:-true}
  JWT_BLACKLIST_AFTER_ROTATION: ${JWT_BLACKLIST_AFTER_ROTATION:-true}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  GIT_COMMIT: ${GIT_COMMIT:-development}
  BUILD_TIME: ${BUILD_TIME:-not-set}

x-backend-build: &backend-build
  context: ./backend
  target: development

x-backend-dependencies: &backend-dependencies
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: ${DB_NAME:-amazon_ads}
      MYSQL_USER: ${DB_USER:-amazon_ads}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-database-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_local_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.5-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_local_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["tools"]
    build: *backend-build
    image: amazon-ads-backend:0.1.0-local
    environment: *backend-environment
    depends_on: *backend-dependencies
    volumes:
      - ./backend:/app
    command: ["python", "manage.py", "migrate", "--noinput"]

  backend:
    build: *backend-build
    image: amazon-ads-backend:0.1.0-local
    environment: *backend-environment
    depends_on: *backend-dependencies
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  celery-worker:
    build: *backend-build
    image: amazon-ads-backend:0.1.0-local
    environment: *backend-environment
    depends_on: *backend-dependencies
    volumes:
      - ./backend:/app
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--queues=default,imports,analysis,maintenance", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && celery -A config inspect ping --timeout 5 --destination celery@$${HOSTNAME} >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery-beat:
    build: *backend-build
    image: amazon-ads-backend:0.1.0-local
    environment: *backend-environment
    depends_on: *backend-dependencies
    volumes:
      - ./backend:/app
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && tr '\\0' ' ' </proc/1/cmdline | grep -Eq 'celery.*beat'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: development
    image: amazon-ads-frontend:0.1.0-local
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_DEV_PROXY_TARGET: http://backend:8000
      CI: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: ["pnpm", "dev", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.28.0-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_local_data:
  redis_local_data:
  frontend_node_modules:
