name: amazon-ads-test

x-test-environment: &test-environment
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: test-only-compose-secret
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,nginx
  USE_MYSQL_TESTS: "true"
  DB_NAME: amazon_ads_test
  DB_TEST_NAME: amazon_ads_test
  DB_USER: amazon_ads_test
  DB_PASSWORD: test-database-password
  DB_HOST: mysql
  DB_PORT: "3306"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CORS_ALLOWED_ORIGINS: http://localhost:8081
  CSRF_TRUSTED_ORIGINS: http://localhost:8081
  APP_VERSION: 0.1.0-test
  GIT_COMMIT: test
  BUILD_TIME: test
  PYTEST_ADDOPTS: --reuse-db
  JWT_ACCESS_TOKEN_TTL_MINUTES: "15"
  JWT_REFRESH_TOKEN_TTL_DAYS: "7"
  JWT_REFRESH_COOKIE_NAME: refresh_token
  JWT_REFRESH_COOKIE_PATH: /api/v1/auth/
  JWT_COOKIE_SECURE: "false"
  JWT_COOKIE_HTTP_ONLY: "true"
  JWT_COOKIE_SAME_SITE: Lax
  JWT_ROTATE_REFRESH_TOKENS: "true"
  JWT_BLACKLIST_AFTER_ROTATION: "true"

x-test-build: &test-build
  context: ./backend
  target: development

x-test-dependencies: &test-dependencies
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: amazon_ads_test
      MYSQL_USER: amazon_ads_test
      MYSQL_PASSWORD: test-database-password
      MYSQL_ROOT_PASSWORD: test-root-password
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.5-alpine3.21
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["tools"]
    build: *test-build
    image: amazon-ads-backend:0.1.0-test
    environment: *test-environment
    depends_on: *test-dependencies
    command: ["python", "manage.py", "migrate", "--noinput"]

  backend:
    build: *test-build
    image: amazon-ads-backend:0.1.0-test
    environment: *test-environment
    volumes:
      - ./tests/fixtures:/tests/fixtures:ro
      - report_test_data:/app/media
    depends_on: *test-dependencies
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  celery-worker:
    build: *test-build
    image: amazon-ads-backend:0.1.0-test
    environment: *test-environment
    volumes:
      - report_test_data:/app/media
    depends_on: *test-dependencies
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--queues=default,imports,analysis,maintenance", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && celery -A config inspect ping --timeout 5 --destination celery@$${HOSTNAME} >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery-beat:
    build: *test-build
    image: amazon-ads-backend:0.1.0-test
    environment: *test-environment
    depends_on: *test-dependencies
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && tr '\\0' ' ' </proc/1/cmdline | grep -Eq 'celery.*beat'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: ""
        VITE_APP_VERSION: 0.1.0-test
        VITE_GIT_COMMIT: test
        VITE_BUILD_TIME: test
    image: amazon-ads-frontend:0.1.0-test
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/frontend-health"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.28.0-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - ./infra/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  # Shared only by backend and worker so async parsers can read uploaded files.
  report_test_data:
