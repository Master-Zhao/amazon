        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPreview'
          description: ''
  /api/v1/actions/tenants/{tenant_id}/previews/{preview_id}/versions:
    post:
      operationId: api_v1_actions_tenants_previews_versions_create
      summary: Append a revised immutable version after RETURNED
      parameters:
      - in: path
        name: preview_id
        schema:
          type: string
        required: true
      - in: path
        name: tenant_id
        schema:
          type: string
        required: true
      tags:
      - actions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnedVersionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReturnedVersionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReturnedVersionRequestRequest'
        required: true
      security:
      - bearerAuth: []
      - xTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPreview'
          description: ''
  /api/v1/actions/tenants/{tenant_id}/previews/{preview_id}/withdraw:
    post:
      operationId: api_v1_actions_tenants_previews_withdraw_create
