          description: ''
  /api/v1/actions/tenants/{tenant_id}/previews/{preview_id}/submit:
    post:
      operationId: api_v1_actions_tenants_previews_submit_create
      summary: Submit a DRAFT Action Preview for single-level approval
      parameters:
      - in: path
        name: preview_id
        schema:
          type: string
        required: true
      - in: path
        name: tenant_id
        schema:
          type: string
        required: true
      tags:
