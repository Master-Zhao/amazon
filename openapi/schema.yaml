components:
  schemas:
    AccessLevelEnum:
      enum:
      - VIEW
      - OPERATE
      - APPROVE
      - EXECUTE
      - MANAGE
      type: string
      description: |-
        * `VIEW` - VIEW
        * `OPERATE` - OPERATE
        * `APPROVE` - APPROVE
        * `EXECUTE` - EXECUTE
        * `MANAGE` - MANAGE
    AccessTokenResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/AccessTokenResult'
        requestId:
          type: string
      required:
      - code
      - data
      - message
      - requestId
    AccessTokenResult:
      type: object
      properties:
        accessToken:
          type: string
      required:
      - accessToken
    ActionPreview:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/ActionPreviewStatusEnum'
        campaign_name:
          type: string
        action_type:
          type: string
        created_by_email:
          type: string
          format: email
        submitted_by_email:
          type: string
          format: email
          nullable: true
        current_version_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        current_version:
          allOf:
          - $ref: '#/components/schemas/ActionPreviewVersion'
          readOnly: true
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRecord'
          readOnly: true
        executions:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionRecord'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action_type
      - approvals
      - campaign_name
      - created_at
      - created_by_email
      - current_version
      - executions
      - id
      - submitted_by_email
      - updated_at
    ActionPreviewStatusEnum:
      enum:
      - DRAFT
      - PENDING_APPROVAL
      - APPROVED
      - REJECTED
      - RETURNED
      - WITHDRAWN
      type: string
      description: |-
        * `DRAFT` - Draft
        * `PENDING_APPROVAL` - Pending approval
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `RETURNED` - Returned
        * `WITHDRAWN` - Withdrawn
    ActionPreviewVersion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        version_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        action_payload: {}
        object_state_version:
          type: string
          maxLength: 128
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action_payload
      - created_at
      - id
      - object_state_version
      - version_number
    ActionTypeEnum:
      enum:
      - UPDATE_CAMPAIGN_BUDGET
      - ENABLE_CAMPAIGN
      - PAUSE_CAMPAIGN
      - SET_CAMPAIGN_STATE
      - UPDATE_KEYWORD_BID
      - ENABLE_KEYWORD
      - PAUSE_KEYWORD
      - SET_KEYWORD_STATE
      - UPDATE_TARGET_BID
      - ENABLE_TARGET
      - PAUSE_TARGET
      - UPDATE_PRODUCT_TARGET_BID
      - SET_PRODUCT_TARGET_STATE
      - ADD_KEYWORD
      - CREATE_KEYWORD
      - ADD_NEGATIVE_KEYWORD
      - CREATE_NEGATIVE_KEYWORD
      type: string
      description: |-
        * `UPDATE_CAMPAIGN_BUDGET` - Update Campaign budget
        * `ENABLE_CAMPAIGN` - Enable Campaign
        * `PAUSE_CAMPAIGN` - Pause Campaign
        * `SET_CAMPAIGN_STATE` - Pause or enable Campaign
        * `UPDATE_KEYWORD_BID` - Update Keyword bid
        * `ENABLE_KEYWORD` - Enable Keyword
        * `PAUSE_KEYWORD` - Pause Keyword
        * `SET_KEYWORD_STATE` - Pause or enable Keyword
        * `UPDATE_TARGET_BID` - Update Target bid
        * `ENABLE_TARGET` - Enable Target
        * `PAUSE_TARGET` - Pause Target
        * `UPDATE_PRODUCT_TARGET_BID` - Update Product Target bid
        * `SET_PRODUCT_TARGET_STATE` - Pause or enable Product Target
        * `ADD_KEYWORD` - Add Keyword
        * `CREATE_KEYWORD` - Create Keyword (legacy)
        * `ADD_NEGATIVE_KEYWORD` - Add Negative Keyword
        * `CREATE_NEGATIVE_KEYWORD` - Create Negative Keyword (legacy)
    AddTeamMemberRequest:
      type: object
      properties:
        membership_id:
          type: string
          minLength: 1
      required:
      - membership_id
    AgentCodeEnum:
      enum:
      - DATA_ANALYSIS
      - ANOMALY_DIAGNOSIS
      - BUDGET_ANALYSIS
      - COMPOSITE_STRATEGY
      type: string
      description: |-
        * `DATA_ANALYSIS` - Data analysis
        * `ANOMALY_DIAGNOSIS` - Anomaly diagnosis
        * `BUDGET_ANALYSIS` - Budget analysis
        * `COMPOSITE_STRATEGY` - Composite strategy
    AgentRun:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        agent_code:
          $ref: '#/components/schemas/AgentCodeEnum'
        status:
          $ref: '#/components/schemas/AgentRunStatusEnum'
        schema_version:
          type: string
          maxLength: 32
        celery_task_id:
          type: string
          maxLength: 128
        output_result: {}
        error_code:
          type: string
          maxLength: 96
        error_message:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
      required:
      - celery_task_id
      - created_at
      - id
    AgentRunStatusEnum:
      enum:
      - QUEUED
      - RUNNING
      - SUCCEEDED
      - FAILED
      type: string
      description: |-
        * `QUEUED` - Queued
        * `RUNNING` - Running
        * `SUCCEEDED` - Succeeded
        * `FAILED` - Failed
    AnalyticsConfiguration:
