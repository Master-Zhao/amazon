              $ref: '#/components/schemas/EffectEvaluationRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EffectEvaluationRequestRequest'
        required: true
      security:
      - bearerAuth: []
      - xTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectEvaluation'
          description: ''
  /api/v1/actions/tenants/{tenant_id}/previews/{preview_id}/executions:
    post:
      operationId: api_v1_actions_tenants_previews_executions_create
      summary: Backfill one manual Amazon console execution result
      parameters:
      - in: path
        name: preview_id
        schema:
          type: string
        required: true
      - in: path
        name: tenant_id
        schema:
          type: string
        required: true
