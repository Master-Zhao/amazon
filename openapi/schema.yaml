  /api/v1/actions/tenants/{tenant_id}/previews/{preview_id}/decision:
    post:
      operationId: api_v1_actions_tenants_previews_decision_create
      summary: Record one append-only approval decision
      parameters:
      - in: path
        name: preview_id
        schema:
          type: string
        required: true
      - in: path
        name: tenant_id
        schema:
          type: string
        required: true
