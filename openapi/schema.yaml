openapi: 3.0.3
info:
  title: Amazon Ads Optimizer API
  version: 0.1.0
  description: V1 account authentication, tenant/store/profile context and permission
    APIs.
paths:
  /api/v1/:
    get:
      operationId: api_v1_retrieve
      summary: Platform API information
      tags:
      - platform
      responses:
        '200':
          description: Phase 1 platform information
  /api/v1/access/tenants/{tenant_id}/member-roles:
    post:
      operationId: api_v1_access_tenants_member_roles_create
      parameters:
      - in: path
        name: tenant_id
        schema:
          type: string
        required: true
      tags:
      - tenant-management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
        required: true
      security:
      - bearerAuth: []
      - xTokenAuth: []
      responses:
        '201':
          description: No response body
  /api/v1/access/tenants/{tenant_id}/members:
    get:
      operationId: api_v1_access_tenants_members_list
      parameters:
      - in: path
        name: tenant_id
        schema:
          type: string
        required: true
      tags:
      - tenant-management
      security:
      - bearerAuth: []
      - xTokenAuth: []
      responses:
        '200':
          content:
            application/json:
