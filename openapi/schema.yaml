  /api/v1/advertising/tenants/{tenant_id}/profiles/{profile_id}/campaigns:
    get:
      operationId: advertising_campaigns_list
      summary: List read-only remote Sponsored Products Campaign performance
      parameters:
      - in: query
        name: enabled
        schema:
          type: boolean
          nullable: true
      - in: query
        name: endDate
        schema:
          type: string
          format: date
      - in: query
        name: includeSummary
        schema:
          type: boolean
          default: true
      - in: query
        name: metricFilters
        schema:
          type: string
          maxLength: 1000
      - in: query
        name: ordering
        schema:
          enum:
          - name
          - targetingType
          - status
          - biddingStrategy
          - startDate
          - endDate
          - dailyBudget
          - impressions
          - spend
          - clicks
          - ctr
          - totalCost
          - orders
          - cpc
          - acos
          - cvr
          - -name
          - -targetingType
          - -status
          - -biddingStrategy
          - -startDate
          - -endDate
          - -dailyBudget
          - -impressions
          - -spend
          - -clicks
          - -ctr
          - -totalCost
          - -orders
          - -cpc
          - -acos
          - -cvr
          type: string
          default: -spend
          minLength: 1
        description: |-
          * `name` - name
          * `targetingType` - targetingType
          * `status` - status
          * `biddingStrategy` - biddingStrategy
          * `startDate` - startDate
          * `endDate` - endDate
          * `dailyBudget` - dailyBudget
          * `impressions` - impressions
          * `spend` - spend
          * `clicks` - clicks
          * `ctr` - ctr
          * `totalCost` - totalCost
          * `orders` - orders
          * `cpc` - cpc
          * `acos` - acos
          * `cvr` - cvr
          * `-name` - -name
          * `-targetingType` - -targetingType
          * `-status` - -status
          * `-biddingStrategy` - -biddingStrategy
          * `-startDate` - -startDate
          * `-endDate` - -endDate
          * `-dailyBudget` - -dailyBudget
          * `-impressions` - -impressions
          * `-spend` - -spend
          * `-clicks` - -clicks
          * `-ctr` - -ctr
          * `-totalCost` - -totalCost
          * `-orders` - -orders
          * `-cpc` - -cpc
          * `-acos` - -acos
          * `-cvr` - -cvr
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 15
      - in: path
        name: profile_id
        schema:
          type: string
        required: true
      - in: query
        name: search
        schema:
          type: string
          maxLength: 100
      - in: query
        name: startDate
        schema:
          type: string
          format: date
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: targetingType
        schema:
          enum:
          - AUTO
          - MANUAL
          type: string
          minLength: 1
        description: |-
          * `AUTO` - AUTO
          * `MANUAL` - MANUAL
      - in: path
        name: tenant_id
        schema:
          type: string
        required: true
      tags:
      - advertising
      security:
      - bearerAuth: []
      - xTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignOverviewResponse'
          description: ''
    post:
      operationId: advertising_campaigns_create
      summary: Create one remote Campaign in SCM metadata
      parameters:
      - in: path
        name: profile_id
        schema:
          type: string
        required: true
      - in: path
        name: tenant_id
        schema:
          type: string
        required: true
      tags:
      - advertising
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
        required: true
      security:
      - bearerAuth: []
      - xTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignCreateResponse'
          description: ''
