          type: string
        required: true
      - in: path
        name: tenant_id
        schema:
          type: string
        required: true
      tags:
      - actions
      security:
      - bearerAuth: []
      - xTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPreview'
          description: ''
  /api/v1/actions/tenants/{tenant_id}/profiles/{profile_id}/previews:
    get:
      operationId: api_v1_actions_tenants_profiles_previews_list
      summary: List Action Previews, approvals and manual execution records
      parameters:
      - in: path
        name: profile_id
