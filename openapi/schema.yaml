      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequestRequest'
        required: true
      security:
      - bearerAuth: []
      - xTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPreview'
          description: ''
  /api/v1/actions/tenants/{tenant_id}/previews/{preview_id}/evaluations:
    post:
      operationId: api_v1_actions_tenants_previews_evaluations_create
      summary: Append a basic post-execution effect evaluation
      parameters:
      - in: path
        name: preview_id
        schema:
          type: string
        required: true
      - in: path
        name: tenant_id
        schema:
          type: string
        required: true
