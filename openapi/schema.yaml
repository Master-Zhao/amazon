      - in: path
        name: tenant_id
        schema:
          type: string
        required: true
      tags:
      - tenant-management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
          multipart/form-data:
