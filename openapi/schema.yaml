  /api/v1/actions/tenants/{tenant_id}/recommendations/{recommendation_id}/previews:
    post:
      operationId: api_v1_actions_tenants_recommendations_previews_create
      summary: Create an immutable Action Preview version from a Recommendation
      parameters:
